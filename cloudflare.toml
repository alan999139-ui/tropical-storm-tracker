# 构建配置
[build]
command = "npm run build"
publish = "dist"

# 环境变量（示例，实际值在 Cloudflare Dashboard 设置）
[env]
# NOAA_API_BASE = "https://www.nhc.noaa.gov"

# Header 缓存策略
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# 重定向规则
[[redirects]]
from = "/storm"
to = "/storms"
status = 301
